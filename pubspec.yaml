name: smooth_refresh
description: A smooth and customizable pull-to-refresh widget with Lottie animation
version: 1.0.0
homepage: https://github.com/yourusername/smooth_refresh

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  assets:
    - assets/default_animation.json
